interface:
  display_name: "X博主跟随发帖"
  short_description: "RSS发现博主新帖，筛选并改写为越南文，在IFXData越南版发布"
  default_prompt: "使用 $x-blogger-follow-post 检查 fxtrader 的 RSS 新帖，按 filters.json v3 过滤中国股市、中国内部政治、中国公司动态和其他低相关内容；国际政治、中美经贸关系、外交访问及领导人抵达/迎接礼仪保留为候选。按当前 chat_preview 模式展示中文训练稿，遵守图片语言、去水印和 QA 规则，暂不提交 IFXData。"
